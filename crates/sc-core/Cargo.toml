[package]
name = "sc-core"
description = "Spark Commander's engine, shared by the GUI and the CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Checksum files: SFV and MD5; ring has the SHAs.
crc32fast = "1"
md-5 = "0.10"
# Compare By Content's line diff; GPUI Kit builds it already.
similar = "2"
# Modification times in local time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The configuration folder of each platform.
dirs = "6"
# Code pages of the viewer; GPUI builds it already.
encoding_rs = "0.8"
# Finds the line ends of big files fast.
memchr = "2"
# Saved server passwords: KWallet or GNOME Keyring, macOS Keychain, Windows Credential Manager.
keyring = "4"
# PDF pages for the viewer, by the bundled PDFium (vendor/pdfium).
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_8125", "thread_safe"] }
# libmpv, loaded when there for video and sound; GPUI builds it already.
libloading = "0.8"
# The viewer's Find; GPUI builds it already.
regex = "1"
# SFTP in pure Rust: ring, as GPUI has it, rather than a C crypto build.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-config = "0.58"
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
# Books for the viewer: an EPUB's zip, its package's and FB2's XML, pictures
# inline; GPUI builds all three already.
flate2 = "1"
roxmltree = "0.21"
base64 = "0.22"
# Their CSS shown on the HTML's elements; GPUI Kit's text view builds both already.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
serde_json = "1"
# Add-ons' list and downloads: rustls with ring, as the rest has it.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Runs the SSH connections, and rclone's for online storage; GPUI builds it already.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "process"] }
# F8 moves to the trash, as each platform keeps one.
trash = "5.3.0"
suppaftp = { version = "12", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"

# mpv draws frames with OpenGL, with no window: by EGL on Linux, by CGL (the
# system's) on macOS, by WGL on Windows; on Linux wgpu builds both already.
[target.'cfg(target_os = "linux")'.dependencies]
khronos-egl = { version = "6", features = ["dynamic"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
glow = "0.17"

# The file manager's own properties dialog (FileManager1); the keyring builds it already.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus = "5"
# Whether the Wayland compositor blurs behind the sidebar; GPUI builds both already.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# Explorer's context menu for files, as Total Commander shows it; GPUI builds it already.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
